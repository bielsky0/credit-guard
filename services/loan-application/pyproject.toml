[project]
name = "crediguard-loan-application"
version = "0.1.0"
description = "Loan Application Service - Application intake, Transactional Outbox, State Machine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.9",
    "aiokafka>=0.10.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.8",
    "pytest-httpx>=0.27.0",
    "testcontainers>=4.8.0",
    "ruff>=0.6.9",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "B904", "UP045"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["../../../libs/events/src", "../../../libs/observability/src"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "crediguard_events.*", "crediguard_observability.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"