[project]
name = "crediguard-notification"
version = "0.1.0"
description = "Notification Service - Kafka loan.status.changed.v1 -> Redis Pub/Sub (no HTTP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.10.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "redis>=5.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.9",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "B904", "UP045"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["../../libs/events/src", "../../libs/observability/src"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "crediguard_events.*", "crediguard_observability.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"
